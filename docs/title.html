<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>영상 타이틀</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { height: 100vh; margin: 0; display: grid; place-items: center; background: var(--ink); color: #fff; }
  .t { width: min(1200px, 90vw); }
  .t small { display: block; font-size: 22px; color: #9FB0C6; margin-bottom: 18px; }
  .t h1 { font-size: 72px; letter-spacing: -0.035em; line-height: 1.1; }
  .t p { font-size: 26px; color: #C9D3E0; margin-top: 22px; max-width: 40ch; line-height: 1.5; }
  .t .flow { margin-top: 44px; display: flex; gap: 14px; align-items: center; font-size: 22px; font-weight: 700; background: none; border: 0; padding: 0; }
  .t .flow span { padding: 10px 18px; border: 2px solid #3A4E6B; border-radius: 10px; }
  .t .flow span.g { background: #fff; color: var(--ink); border-color: #fff; }
  .t .flow i { width: 40px; height: 2px; background: #3A4E6B; }
</style></head>
<body><div class="t" id="t"></div>
<script>
const q = new URLSearchParams(location.search).get('v') || 'intro';
const C = {
  intro: `<small>Ntrophy Gateway · 해커톤 PoC 모의 시연</small><h1>AI API 키가 유출돼도<br>손실은 한도 안에서 멈춥니다</h1><p>게이트웨이 기록과 공급자 사용량을 대조해 무단 사용을 찾고, 키 폐기와 예비 키 전환까지 스스로 끝냅니다.</p><div class="flow"><span>사내 PC</span><i></i><span class="g">Ntrophy Gateway</span><i></i><span>OpenAI · Claude · Gemini</span></div>`,
  dash: `<small>2부</small><h1>관제 대시보드</h1><p>같은 일을 대표가 보는 화면에서 다시 봅니다. 데모 제어에서 공격을 시작하면 탐지, 차단, 복구, 사고 기록이 이어집니다.</p>`,
  end: `<small>정리</small><h1>탐지 지연을 대조로,<br>서비스 중단을 예비 키로</h1><p>WIF 우선, Vault 보관, IP 대역과 게이트웨이 토큰 접근 통제, 허니키로 게이트웨이 자체 공격 탐지.</p>`,
};
document.getElementById('t').innerHTML = C[q];
</script></body></html>
